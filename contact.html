<section>

<h2>Contact Form</h2>

<form aria-label="Contact Form">

<label for="name">Name</label>

<input
type="text"
id="name"
name="name"
required
aria-required="true">

<label for="email">Email</label>

<input
type="email"
id="email"
name="email"
required
aria-required="true">

<label for="message">Message</label>

<textarea
id="message"
name="message"
rows="5"
required
aria-required="true"></textarea>

<button type="submit">
Send Message
</button>

</form>

</section>

</main>

<footer>
